# Copy this file to `secrets.yaml` (git-ignored) and set machine-local values.
#   Never commit `secrets.yaml` or copy its values into issues, logs or code.
# `Data` is the data root used instead of `data_storage_path` in config.yml.
#   It holds the large raw inputs (`Input/`), the processed rasters and the
#   target stores (`Targets_data/`). A worktree points it at the `Data`
#   folder of the main checkout, so raw inputs are reconnected, never
#   copied. Delete the line to use the repository's `Data/` folder.
Data: "D:/Path/To/VegVault-abiotic_data/Data"
